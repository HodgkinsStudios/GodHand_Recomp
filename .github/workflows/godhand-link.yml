name: GodHand - Link AOT and test first frame
# Full native recompile is deliberately manual-only. Use the prebuilt smoke
# workflow for fast boot regressions; never auto-build 9,231 guest C++ files.
on:
  push:
    branches: [main]
    paths: ['built/aot/generated_cpp.tar.gz']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godhand-native-link-${{ github.ref }}
  # Keep a running compile alive when another source-only commit is pushed.
  cancel-in-progress: false

jobs:
  native-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1200M
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Checkout source without downloading retail disc
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: true

      - name: Restore only previously generated AOT sources from LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='built/aot/generated_cpp.tar.gz' --exclude=''
          test "$(stat -c %s built/aot/generated_cpp.tar.gz)" -gt 1000000
          mkdir -p "$RUNNER_TEMP/godhand_aot" built/reports
          tar -xzf built/aot/generated_cpp.tar.gz -C "$RUNNER_TEMP/godhand_aot"
          test -s "$RUNNER_TEMP/godhand_aot/register_functions.cpp"
          test -s "$RUNNER_TEMP/godhand_aot/ps2_recompiled_functions.h"
          test -s "$RUNNER_TEMP/godhand_aot/ps2_recompiled_stubs.h"
          find "$RUNNER_TEMP/godhand_aot" -name '*.cpp' | wc -l

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache pkg-config git \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev xvfb xauth

      - name: Restore incremental generated C++ compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-${{ github.run_id }}-restore
          restore-keys: |
            godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-
            godhand-aot-gcc13-v1-

      - name: Validate compilation batch planner
        shell: bash
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_aot_batch_build.py' -v
          ccache --zero-stats

      - name: Configure all generated guest C++ into native runner
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p built/reports
          code=0
          cmake -S . -B build-game -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 \
            -DPS2X_BUILD_RECOMP=OFF -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_RUNTIME=ON -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_TEST=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_RUNNER_UNITY_BUILD=OFF -DPS2X_ENABLE_RUNNER_PCH=OFF \
            -DPS2X_AOT_FAST_COMPILE=ON \
            -DPS2X_AOT_SOURCE_DIR="$RUNNER_TEMP/godhand_aot" \
            > "$RUNNER_TEMP/godhand-configure.log" 2>&1 || code=$?
          echo "native_configure_exit_code=$code" > built/reports/link_ci_configure.txt
          tail -n 65 "$RUNNER_TEMP/godhand-configure.log" >> built/reports/link_ci_configure.txt

      - name: Compile generated C++ batch 1 of 4
        id: batch1
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/aot_batch_build.py \
            --compile-commands build-game/compile_commands.json \
            --source-dir "$RUNNER_TEMP/godhand_aot" \
            --build-dir build-game --batch 1 --batches 4 --jobs 4 \
            --log "$RUNNER_TEMP/godhand-batch-1.log"

      - name: Save compiled C++ cache after batch 1
        if: always() && steps.batch1.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-${{ github.run_id }}-batch1

      - name: Compile generated C++ batch 2 of 4
        id: batch2
        if: steps.batch1.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/aot_batch_build.py \
            --compile-commands build-game/compile_commands.json \
            --source-dir "$RUNNER_TEMP/godhand_aot" \
            --build-dir build-game --batch 2 --batches 4 --jobs 4 \
            --log "$RUNNER_TEMP/godhand-batch-2.log"

      - name: Save compiled C++ cache after batch 2
        if: always() && steps.batch2.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-${{ github.run_id }}-batch2

      - name: Compile generated C++ batch 3 of 4
        id: batch3
        if: steps.batch2.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/aot_batch_build.py \
            --compile-commands build-game/compile_commands.json \
            --source-dir "$RUNNER_TEMP/godhand_aot" \
            --build-dir build-game --batch 3 --batches 4 --jobs 4 \
            --log "$RUNNER_TEMP/godhand-batch-3.log"

      - name: Save compiled C++ cache after batch 3
        if: always() && steps.batch3.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-${{ github.run_id }}-batch3

      - name: Compile generated C++ batch 4 of 4
        id: batch4
        if: steps.batch3.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/aot_batch_build.py \
            --compile-commands build-game/compile_commands.json \
            --source-dir "$RUNNER_TEMP/godhand_aot" \
            --build-dir build-game --batch 4 --batches 4 --jobs 4 \
            --log "$RUNNER_TEMP/godhand-batch-4.log"

      - name: Save compiled C++ cache after batch 4
        if: always() && steps.batch4.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: godhand-aot-gcc13-v1-${{ hashFiles('built/aot/generated_cpp.tar.gz') }}-${{ github.run_id }}-batch4

      - name: Attempt complete AOT game link
        if: steps.batch4.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p built/reports built/linux-x86_64
          code=0
          # C++ translation units are already compiled in four persistent batches.
          # Only host runtime objects and final linker work should remain.
          timeout --kill-after=5s 3600s \
            cmake --build build-game --target ps2EntryRunner --parallel 4 \
            2>&1 | tee "$RUNNER_TEMP/godhand-link.log" || code=${PIPESTATUS[0]}
          echo "native_link_exit_code=$code" > built/reports/link_ci_status.txt
          printf '\nFIRST ERRORS\n' >> built/reports/link_ci_status.txt
          grep -n -m 50 -E 'FAILED:|error:|fatal error:|undefined reference|collect2:|ninja: build stopped' \
            "$RUNNER_TEMP/godhand-link.log" >> built/reports/link_ci_status.txt || true
          printf '\nBUILD TAIL\n' >> built/reports/link_ci_status.txt
          tail -n 100 "$RUNNER_TEMP/godhand-link.log" >> built/reports/link_ci_status.txt
          if test "$code" -eq 0 && test -x build-game/ps2xRuntime/ps2EntryRunner; then
            cp build-game/ps2xRuntime/ps2EntryRunner built/linux-x86_64/GodHand_Recomp_Game
            chmod +x built/linux-x86_64/GodHand_Recomp_Game
            (cd built/linux-x86_64 && sha256sum GodHand_Recomp_Game > GodHand_Recomp_Game.sha256)
          fi
          exit 0

      - name: Report batch results and compiler cache stats
        if: always()
        shell: bash
        run: |
          mkdir -p built/reports
          {
            echo 'AOT compilation batch outcomes:'
            echo 'batch_1=${{ steps.batch1.outcome }}'
            echo 'batch_2=${{ steps.batch2.outcome }}'
            echo 'batch_3=${{ steps.batch3.outcome }}'
            echo 'batch_4=${{ steps.batch4.outcome }}'
            for n in 1 2 3 4; do
              log="$RUNNER_TEMP/godhand-batch-$n.log"
              if test -s "$log"; then
                echo "--- batch $n first errors ---"
                grep -m 12 -E 'FAILED:|error:|fatal error:|undefined reference|ninja: build stopped' "$log" || true
                echo "--- batch $n last progress ---"
                tail -n 4 "$log"
              fi
            done
            echo '--- ccache summary ---'
            ccache --show-stats || true
          } | tee built/reports/link_ci_batches.txt
          if test '${{ steps.batch4.outcome }}' != 'success' && ! test -f built/reports/link_ci_status.txt; then
            echo 'native_link_exit_code=skipped_due_to_batch_compilation_failure' > built/reports/link_ci_status.txt
          fi

      - name: Upload full compiler logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godhand-compiler-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/godhand-batch-*.log
            ${{ runner.temp }}/godhand-link.log
            ${{ runner.temp }}/godhand-configure.log

      - name: Attempt actual GS frame under Xvfb only after game links
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p built/reports built/frames
          game=build-game/ps2xRuntime/ps2EntryRunner
          if ! test -x "$game"; then
            echo 'native_executable=not_built' > built/reports/link_ci_frame.txt
            exit 0
          fi
          if ! git lfs pull --include='iso/GodHand.iso.part-*' --exclude=''; then
            echo 'native_executable=built;iso_lfs_download=failed' > built/reports/link_ci_frame.txt
            exit 0
          fi
          cat iso/GodHand.iso.part-* > "$RUNNER_TEMP/GodHand.iso"
          mkdir -p "$RUNNER_TEMP/game"
          if ! python3 tools/godhand_iso_pipeline.py --iso "$RUNNER_TEMP/GodHand.iso" \
              --out "$RUNNER_TEMP/game" --extract-elf; then
            echo 'native_executable=built;boot_elf_extraction=failed' > built/reports/link_ci_frame.txt
            exit 0
          fi
          status=0
          export GODHAND_GS_FRAME_PPM="$RUNNER_TEMP/godhand_first_frame.ppm"
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout --kill-after=5s 90s xvfb-run -a -s '-screen 0 1280x720x24' \
            "$game" "$RUNNER_TEMP/game/boot.elf" \
            > "$RUNNER_TEMP/godhand-execution.log" 2>&1 || status=$?
          printf 'native_executable=built\nexecution_exit_code=%s\n' "$status" > built/reports/link_ci_frame.txt
          tail -n 100 "$RUNNER_TEMP/godhand-execution.log" >> built/reports/link_ci_frame.txt
          if test -s "$GODHAND_GS_FRAME_PPM"; then
            cp "$GODHAND_GS_FRAME_PPM" built/frames/first_real_gs_frame.ppm
            echo 'nonuniform_guest_gs_frame=yes' >> built/reports/link_ci_frame.txt
          else
            echo 'nonuniform_guest_gs_frame=no' >> built/reports/link_ci_frame.txt
          fi

      - name: Publish compiler reports and genuine game binary to main
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir -p "$staging/reports" "$staging/linux-x86_64" "$staging/frames"
          cp -f built/reports/link_ci_* "$staging/reports/" 2>/dev/null || true
          for item in GodHand_Recomp_Game GodHand_Recomp_Game.sha256; do
            if test -f "built/linux-x86_64/$item"; then
              cp "built/linux-x86_64/$item" "$staging/linux-x86_64/"
            fi
          done
          if test -s built/frames/first_real_gs_frame.ppm; then
            cp built/frames/first_real_gs_frame.ppm "$staging/frames/"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p built/reports built/linux-x86_64 built/frames
            cp -f "$staging/reports/"* built/reports/ 2>/dev/null || true
            cp -f "$staging/linux-x86_64/"* built/linux-x86_64/ 2>/dev/null || true
            cp -f "$staging/frames/"* built/frames/ 2>/dev/null || true
            git add -f built/reports/link_ci_* 2>/dev/null || true
            for item in GodHand_Recomp_Game GodHand_Recomp_Game.sha256; do
              if test -f "built/linux-x86_64/$item"; then
                git add -f "built/linux-x86_64/$item"
              fi
            done
            if test -s built/frames/first_real_gs_frame.ppm; then
              git add -f built/frames/first_real_gs_frame.ppm
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'build: record God Hand native game link and frame test [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Failed to publish built files after 3 attempts' >&2
          exit 1

      - name: Fail job if native game has not linked yet
        if: always()
        run: |
          test -x build-game/ps2xRuntime/ps2EntryRunner || {
            echo 'Native game executable is not yet built. See built/reports/link_ci_status.txt.'
            exit 1
          }
