name: GodHand - ISO9660 directory inventory (metadata only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/godhand-iso-inventory.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iso-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - name: Assemble original ISO from authorized LFS parts
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='iso/GodHand.iso.part-*' --exclude=''
          cat iso/GodHand.iso.part-* > "$RUNNER_TEMP/GodHand.iso"
      - name: Inspect original ISO9660 file names and extents (never extract data)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p built/reports
          python3 - "$RUNNER_TEMP/GodHand.iso" <<'PY' | tee built/reports/disc_file_inventory.txt
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from godhand_iso_pipeline import iso_entries
          image = Path(sys.argv[1])
          with image.open('rb') as stream:
              entries = iso_entries(stream)
          print('iso_bytes=', image.stat().st_size)
          print('entry_count=', len(entries))
          print('file_count=', sum(not d for _, _, d in entries.values()))
          print('--- ISO9660 directory entries (name, LSN, bytes, directory) ---')
          for name, (lsn, size, isdir) in sorted(entries.items()):
              print(f'{name} | lsn={lsn} | size={size} | directory={int(isdir)}')
          needle = 'MODULES/SDRDRV.IRX'
          print('sdrdrv_irx_present=', int(needle in entries and not entries[needle][2]))
          PY
      - name: Publish metadata-only report to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f built/reports/disc_file_inventory.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: audit actual God Hand ISO9660 directory [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
