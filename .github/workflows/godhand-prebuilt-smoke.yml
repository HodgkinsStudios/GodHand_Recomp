name: GodHand - Prebuilt runtime smoke (no recompilation)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godhand-prebuilt-smoke.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['GodHand - Link AOT and test first frame']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: godhand-prebuilt-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without heavy LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true

      - name: Restore checksum-verified EXISTING AOT executable
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='built/linux-x86_64/GodHand_Recomp_Game' --exclude=''
          game=built/linux-x86_64/GodHand_Recomp_Game
          test "$(stat -c %s "$game")" -gt 1000000
          chmod +x "$game"
          (cd built/linux-x86_64 && sha256sum -c GodHand_Recomp_Game.sha256)
          file "$game"
          mkdir -p built/reports built/frames
          rm -f built/frames/first_real_gs_frame.ppm

      - name: Restore ISO only to extract the original boot ELF
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include='iso/GodHand.iso.part-*' --exclude=''
          test "$(stat -c %s iso/GodHand.iso.part-000)" -gt 1000000
          cat iso/GodHand.iso.part-* > "$RUNNER_TEMP/GodHand.iso"
          mkdir -p "$RUNNER_TEMP/godhand_boot"
          python3 tools/godhand_iso_pipeline.py --iso "$RUNNER_TEMP/GodHand.iso" \
            --out "$RUNNER_TEMP/godhand_boot" --extract-elf
          test -s "$RUNNER_TEMP/godhand_boot/boot.elf"

      - name: Audit real ELF embedded guest callback pointer tables
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_scan_guest_pointer_tables.py' -v
          python3 tools/scan_guest_pointer_tables.py \
            --elf "$RUNNER_TEMP/godhand_boot/boot.elf" \
            --report built/reports/code_pointer_audit.json
          test -s built/reports/code_pointer_audit.json

      - name: Install headless graphics dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1 libx11-6 \
            libxrandr2 libxi6 libxinerama1 libxcursor1 libasound2t64

      - name: Bounded 20-second genuine guest boot and diagnostics
        shell: bash
        run: |
          set -uo pipefail
          game="$GITHUB_WORKSPACE/built/linux-x86_64/GodHand_Recomp_Game"
          logfile="$RUNNER_TEMP/godhand-prebuilt-execution.log"
          frame="$RUNNER_TEMP/godhand-prebuilt-first-frame.ppm"
          rm -f "$frame" built/frames/first_real_gs_frame.ppm
          code=0
          GODHAND_GS_FRAME_PPM="$frame" LIBGL_ALWAYS_SOFTWARE=1 \
            PS2X_CD_IMAGE="$RUNNER_TEMP/GodHand.iso" \
            PS2X_GUEST_WATCH_ADDR=0x1ffff10 \
            timeout --kill-after=3s 20s xvfb-run -a -s '-screen 0 1280x720x24' \
            "$game" "$RUNNER_TEMP/godhand_boot/boot.elf" \
            > "$logfile" 2>&1 || code=$?
          {
            echo "source_commit=$GITHUB_SHA"
            echo 'used_prebuilt_game=yes'
            echo 'native_recompilation=no'
            echo "execution_exit_code=$code"
            echo 'execution_limit_seconds=20'
            if test -s "$frame"; then
              echo 'nonuniform_guest_gs_frame=yes'
            else
              echo 'nonuniform_guest_gs_frame=no'
            fi
            echo '--- first missing guest target ---'
            grep -m 1 -F '[guest-branch:missing-target]' "$logfile" || true
            echo '--- first stack writes and original EE return diagnostics ---'
            grep -m 95 -E '\[EE:stack-write\]|\[EE:stack-dispatch-delta\]|\[EE:invalid-return\]|\[EE:main-dormant-cause\]' "$logfile" || true
            echo '--- recent guest ticks ---'
            grep -F '[run:tick]' "$logfile" | tail -n 3 || true
            echo '--- execution log tail ---'
            tail -n 90 "$logfile"
          } > built/reports/prebuilt_smoke_status.txt
          if test -s "$frame"; then
            cp "$frame" built/frames/first_real_gs_frame.ppm
          fi
          grep -E '^(execution_exit_code|nonuniform_guest_gs_frame)=' built/reports/prebuilt_smoke_status.txt
          grep -m 1 -F '[guest-branch:missing-target]' "$logfile" || true
          exit 0

      - name: Diagnose persistent guest PC from real boot ELF
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p built/reports
          python3 - "$RUNNER_TEMP/godhand_boot/boot.elf" \
            "$RUNNER_TEMP/godhand-prebuilt-execution.log" \
            built/reports/guest_stall_inspection.txt <<'PY'
          import collections
          import pathlib
          import re
          import struct
          import sys

          elfpath, logpath, outpath = map(pathlib.Path, sys.argv[1:4])
          log = logpath.read_text(errors='replace') if logpath.exists() else ''
          pcs = [int(v, 16) for v in re.findall(r'\[run:tick\][^\n]*?\bpc=0x([0-9a-fA-F]+)', log)]
          if not pcs or not elfpath.is_file():
              outpath.write_text('No guest tick PC or original ELF available\n')
              sys.exit(0)
          target, count = collections.Counter(pcs).most_common(1)[0]
          elf = elfpath.read_bytes()
          if elf[:6] != b'\x7fELF\x01\x01':
              outpath.write_text('Unexpected ELF class or endian\n')
              sys.exit(0)
          phoff = struct.unpack_from('<I', elf, 28)[0]
          phentsize, phnum = struct.unpack_from('<HH', elf, 42)
          segments = []
          for n in range(phnum):
              pos = phoff + n * phentsize
              if pos + 32 > len(elf):
                  break
              kind, offset, vaddr, _, filesz, memsz, flags, _ = struct.unpack_from('<8I', elf, pos)
              if kind == 1 and flags & 1 and offset + filesz <= len(elf):
                  segments.append((vaddr, vaddr + filesz, offset, flags))
          def read_word(addr):
              for lo, hi, off, _ in segments:
                  if lo <= addr and addr + 4 <= hi:
                      return struct.unpack_from('<I', elf, off + addr - lo)[0]
              return None
          def decode(pc, w):
              op = w >> 26
              rs, rt, rd = (w >> 21) & 31, (w >> 16) & 31, (w >> 11) & 31
              imm = w & 0xffff
              signed = imm if imm < 0x8000 else imm - 0x10000
              branch = (pc + 4 + signed * 4) & 0xffffffff
              if w == 0: return 'nop'
              if op == 0:
                  fun = w & 63
                  if fun == 8: return f'jr r{rs}'
                  if fun == 9: return f'jalr r{rs}, r{rd}'
                  if fun in (0x20,0x21): return f'add(u) r{rd}, r{rs}, r{rt}'
                  if fun in (0x24,0x25): return f'and/or r{rd}, r{rs}, r{rt}'
                  if fun in (0x2a,0x2b): return f'slt(u) r{rd}, r{rs}, r{rt}'
                  return f'special funct=0x{fun:02x} rs={rs} rt={rt} rd={rd}'
              if op in (2,3):
                  addr = ((pc + 4) & 0xf0000000) | ((w & 0x3ffffff) << 2)
                  return ('jal' if op == 3 else 'j') + f' 0x{addr:08x}'
              if op in (4,5,6,7):
                  return f'{("beq","bne","blez","bgtz")[op-4]} r{rs}, r{rt} -> 0x{branch:08x}'
              if op == 1:
                  return f'regimm rt={rt} r{rs} -> 0x{branch:08x}'
              if op == 9: return f'addiu r{rt}, r{rs}, {signed}'
              if op == 0xf: return f'lui r{rt}, 0x{imm:04x}'
              if op == 0xd: return f'ori r{rt}, r{rs}, 0x{imm:04x}'
              if op == 0xc: return f'andi r{rt}, r{rs}, 0x{imm:04x}'
              if op in (0x20,0x21,0x23,0x24,0x25,0x27,0x28,0x29,0x2b,0x2f,0x37,0x3f):
                  names={0x20:'lb',0x21:'lh',0x23:'lw',0x24:'lbu',0x25:'lhu',0x27:'lwu',0x28:'sb',0x29:'sh',0x2b:'sw',0x2f:'cache',0x37:'ld',0x3f:'sd'}
                  return f'{names[op]} r{rt}, {signed}(r{rs})'
              return f'op=0x{op:02x} rs={rs} rt={rt} imm=0x{imm:04x}'
          output = [f'observed_stall_pc=0x{target:08X}',f'pc_samples={count}/{len(pcs)}',
                    f'executable_elf_segments={len(segments)}',
                    'Note: raw original PS2 ELF instructions; no guest code patched.',
                    '---- MIPS instructions surrounding persistent guest PC ----']
          for addr in range(max(0,target-0xa0)&~3, target+0x84,4):
              word = read_word(addr)
              output.append(f'{"=>" if addr == target else "  "} 0x{addr:08x}: ' +
                            (f'0x{word:08x}  {decode(addr,word)}' if word is not None else 'NOT_FILE_BACKED'))
          outpath.write_text('\n'.join(output)+'\n')
          print('\n'.join(output))
          PY

      - name: Upload failure transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godhand-prebuilt-smoke-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/godhand-prebuilt-execution.log
            built/reports/prebuilt_smoke_status.txt
            built/reports/guest_stall_inspection.txt
            built/reports/code_pointer_audit.json

      - name: Publish only fresh boot-smoke report to main
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s built/reports/prebuilt_smoke_status.txt || exit 0
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp built/reports/prebuilt_smoke_status.txt "$staging/"
          if test -s built/reports/guest_stall_inspection.txt; then
            cp built/reports/guest_stall_inspection.txt "$staging/"
          fi
          if test -s built/reports/code_pointer_audit.json; then
            cp built/reports/code_pointer_audit.json "$staging/"
          fi
          if test -s built/frames/first_real_gs_frame.ppm; then
            cp built/frames/first_real_gs_frame.ppm "$staging/"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p built/reports built/frames
            cp "$staging/prebuilt_smoke_status.txt" built/reports/
            git add -f built/reports/prebuilt_smoke_status.txt
            if test -s "$staging/guest_stall_inspection.txt"; then
              cp "$staging/guest_stall_inspection.txt" built/reports/
              git add -f built/reports/guest_stall_inspection.txt
            fi
            if test -s "$staging/code_pointer_audit.json"; then
              cp "$staging/code_pointer_audit.json" built/reports/
              git add -f built/reports/code_pointer_audit.json
            fi
            if test -s "$staging/first_real_gs_frame.ppm"; then
              cp "$staging/first_real_gs_frame.ppm" built/frames/
              git add -f built/frames/first_real_gs_frame.ppm
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'test: record short prebuilt God Hand boot probe [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Fail only when genuine guest framebuffer is absent
        if: always()
        shell: bash
        run: |
          if ! test -s built/frames/first_real_gs_frame.ppm; then
            echo 'Prebuilt boot did not render a genuine GS frame; see prebuilt_smoke_status.txt.'
            exit 1
          fi
          echo 'First nonuniform guest framebuffer captured; inspect before gameplay claims.'
