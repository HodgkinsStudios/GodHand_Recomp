name: GodHand - Linux launcher build
on:
  push:
    branches: [main]
    paths:
      - 'godhandLauncher/**'
      - 'tools/tests/**'
      - '.github/workflows/godhand-cloud-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgtk-3-dev libarchive-dev libsdl2-dev
      - name: Compile, verify and test launcher
        shell: bash
        run: |
          set -euo pipefail
          cmake -S godhandLauncher -B build-godhand-launcher -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-godhand-launcher --parallel 2
          test -x build-godhand-launcher/GodHand_Recomp_Launcher
          ctest --test-dir build-godhand-launcher --output-on-failure
          python3 -m unittest discover -s tools/tests -v
      - name: Stage AOT-ready launcher binary in built/
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p built/linux-x86_64
          cp build-godhand-launcher/GodHand_Recomp_Launcher built/linux-x86_64/GodHand_Recomp_Launcher
          chmod +x built/linux-x86_64/GodHand_Recomp_Launcher
          sha256sum built/linux-x86_64/GodHand_Recomp_Launcher > built/linux-x86_64/SHA256SUMS.txt
      - name: Commit built files to main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f built/linux-x86_64/GodHand_Recomp_Launcher built/linux-x86_64/SHA256SUMS.txt
          if git diff --cached --quiet; then echo 'No built file changes'; exit 0; fi
          git commit -m 'build: update validated Linux GodHand launcher [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
