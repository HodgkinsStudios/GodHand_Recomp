name: GodHand - ISO boot ELF and AOT analysis
on:
  push:
    branches: [main]
    paths:
      - 'tools/godhand_iso_pipeline.py'
      - 'tools/tests/test_iso_pipeline.py'
      - '.github/workflows/godhand-aot.yml'
  workflow_dispatch:
    inputs:
      attempt_full_native_build:
        description: 'Try full native game link only after compiler probe passes (expensive)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: godhand-aot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect-and-recompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and ISO LFS parts
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          persist-credentials: true
      - name: Verify LFS and parser unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -v
          git lfs ls-files
          test -s iso/GodHand.iso.part-000
          test -s iso/GodHand.iso.part-001
          # A Git LFS pointer is ~130 bytes, not a valid disc payload.
          test "$(stat -c %s iso/GodHand.iso.part-000)" -gt 1000000
      - name: Reassemble ISO on ephemeral hosted runner
        run: |
          set -euo pipefail
          cat iso/GodHand.iso.part-* > "$RUNNER_TEMP/GodHand.iso"
          test "$(stat -c %s "$RUNNER_TEMP/GodHand.iso")" -gt 1000000000
      - name: Read boot configuration and validate MIPS ELF
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game" built/reports
          python3 tools/godhand_iso_pipeline.py \
            --iso "$RUNNER_TEMP/GodHand.iso" --out "$RUNNER_TEMP/game" --extract-elf
          cp "$RUNNER_TEMP/game/iso_report.json" built/reports/iso_report.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config build-essential git \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Build upstream analyzer and recompiler
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-aot -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_ANALYZER=ON \
            -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_TEST=OFF \
            -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1
          cmake --build build-aot --parallel 2
      - name: Analyze boot ELF and attempt static recompilation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p built/aot built/reports
          ANALYZER="$(find build-aot -type f -name ps2_analyzer -executable -print -quit)"
          RECOMP="$(find build-aot -type f -name ps2_recomp -executable -print -quit)"
          if [ -z "$ANALYZER" ] || [ -z "$RECOMP" ]; then echo 'Analyzer/recompiler binary not found'; exit 1; fi
          status=0
          timeout 1800 "$ANALYZER" "$RUNNER_TEMP/game/boot.elf" "$RUNNER_TEMP/game/godhand.toml" \
            > "$RUNNER_TEMP/analyzer.log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            # The analyzer's generated paths remain in ephemeral runner storage.
            timeout 2400 "$RECOMP" "$RUNNER_TEMP/game/godhand.toml" \
              > "$RUNNER_TEMP/recomp.log" 2>&1 || status=$?
          fi
          printf 'analyzer_and_recompiler_exit_status=%s\n' "$status" > built/reports/aot_status.txt
          if [ -f "$RUNNER_TEMP/analyzer.log" ]; then tail -n 100 "$RUNNER_TEMP/analyzer.log" > built/reports/analyzer_tail.txt; fi
          if [ -f "$RUNNER_TEMP/recomp.log" ]; then tail -n 100 "$RUNNER_TEMP/recomp.log" > built/reports/recompiler_tail.txt; fi
          # Generated C++ is not automatically an executable or proof of booting.
          find "$RUNNER_TEMP/game" -type f -name '*.cpp' -print > "$RUNNER_TEMP/generated-files.txt"
          if [ -s "$RUNNER_TEMP/generated-files.txt" ]; then
            find "$RUNNER_TEMP/game" -type f -name '*.cpp' -printf '%P\n' | sort > built/reports/generated_files.txt
            # Include generated headers as well as translation units. The previous
            # archive omitted headers and could not be compiled independently.
            (cd "$RUNNER_TEMP/game/output" && tar -czf "$GITHUB_WORKSPACE/built/aot/generated_cpp.tar.gz" .)
          fi
          echo "AOT diagnostic stage exit status: $status"
          exit 0
      - name: Summarize unhandled translation errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p built/reports
          if test -f "$RUNNER_TEMP/recomp.log"; then
            python3 tools/aot_diagnostics.py \
              --log "$RUNNER_TEMP/recomp.log" \
              --generated-list built/reports/generated_files.txt \
              --output built/reports/unhandled_instructions.json
          fi
      - name: Configure native runtime against generated AOT functions
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUTPUT="$RUNNER_TEMP/game/output"
          if ! test -s "$OUTPUT/register_functions.cpp" || \
             ! test -s "$OUTPUT/ps2_recompiled_functions.h" || \
             ! test -s "$OUTPUT/ps2_recompiled_stubs.h"; then
            echo 'Generated AOT headers or registration table unavailable' > built/reports/native_configure.txt
            exit 0
          fi
          timeout 1200 cmake -S . -B build-game -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 \
            -DPS2X_BUILD_RECOMP=OFF -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_RUNTIME=ON -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_TEST=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_RUNNER_UNITY_BUILD=OFF -DPS2X_ENABLE_RUNNER_PCH=OFF \
            -DPS2X_AOT_SOURCE_DIR="$OUTPUT" \
            > "$RUNNER_TEMP/native-configure.log" 2>&1
          STATUS=$?
          printf 'cmake_configure_exit_code=%s\n' "$STATUS" > built/reports/native_configure.txt
          tail -n 100 "$RUNNER_TEMP/native-configure.log" >> built/reports/native_configure.txt
          exit 0
      - name: Compile boot entry and function table with real runtime headers
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if test -s build-game/compile_commands.json; then
            python3 tools/aot_compile_probe.py \
              --compile-commands build-game/compile_commands.json \
              --generated-dir "$RUNNER_TEMP/game/output" \
              --output built/reports/native_compile_probe.json \
              --limit 3
          else
            echo '{"selected_translation_units":0,"reason":"native CMake configure did not succeed"}' \
              > built/reports/native_compile_probe.json
          fi
          exit 0
      - name: Attempt full native executable
        if: inputs.attempt_full_native_build == true || github.event_name == 'push' 
        shell: bash
        run: |
          set -uo pipefail
          if ! test -s build-game/build.ninja; then
            echo 'native build not configured' > built/reports/native_link_status.txt
            exit 0
          fi
          if ! python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('built/reports/native_compile_probe.json')
          if not p.exists():
              raise SystemExit(1)
          d = json.loads(p.read_text())
          raise SystemExit(0 if d.get('selected_translation_units', 0) >= 2 and d.get('failed_translation_units', 1) == 0 else 1)
          PYCODE
          then
            echo 'native_link=skipped_until_compile_probe_passes' > built/reports/native_link_status.txt
            exit 0
          fi
          timeout 3600 cmake --build build-game --target ps2EntryRunner --parallel 2 \
            > "$RUNNER_TEMP/native-build.log" 2>&1
          STATUS=$?
          printf 'native_link_exit_code=%s\n' "$STATUS" > built/reports/native_link_status.txt
          tail -n 100 "$RUNNER_TEMP/native-build.log" >> built/reports/native_link_status.txt
          if [ "$STATUS" -eq 0 ] && test -x build-game/ps2xRuntime/ps2EntryRunner; then
            mkdir -p built/linux-x86_64
            cp build-game/ps2xRuntime/ps2EntryRunner built/linux-x86_64/GodHand_Recomp_Game
          fi
          exit 0
      - name: Boot linked native game under Xvfb and check real GS frame
        if: inputs.attempt_full_native_build == true || github.event_name == 'push' 
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p built/reports built/frames
          GAME=build-game/ps2xRuntime/ps2EntryRunner
          if ! test -x "$GAME"; then
            echo 'native_executable=not_built' > built/reports/native_frame_status.txt
            exit 0
          fi
          sudo apt-get install -y xvfb xauth >/dev/null 2>&1 || true
          # The capture hook accepts only nonuniform pixels returned from GS.
          # A window opening or a blank fallback frame is NOT a frame pass.
          OUTPUT="$RUNNER_TEMP/real-gs-frame.ppm"
          GODHAND_GS_FRAME_PPM="$OUTPUT" LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --kill-after=5s 75s xvfb-run -a \
            -s '-screen 0 1280x720x24' "$GAME" "$RUNNER_TEMP/game/boot.elf" \
            > "$RUNNER_TEMP/native-execution.log" 2>&1
          STATUS=$?
          printf 'native_executable=present\nexit_code=%s\n' "$STATUS" \
            > built/reports/native_frame_status.txt
          tail -n 100 "$RUNNER_TEMP/native-execution.log" \
            >> built/reports/native_frame_status.txt
          if test -s "$OUTPUT"; then
            cp "$OUTPUT" built/frames/first_real_gs_frame.ppm
            echo 'nonuniform_guest_gs_frame=yes' >> built/reports/native_frame_status.txt
          else
            echo 'nonuniform_guest_gs_frame=no' >> built/reports/native_frame_status.txt
          fi
          exit 0
      - name: Commit diagnostic built outputs to main
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep CI products outside the working Git tree while fetching main.
          # Rebasing large generated tarballs caused LFS add/add conflicts when
          # multiple CI jobs were finishing together in CP04.
          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          for name in reports aot frames; do
            if test -d "built/$name"; then
              mkdir -p "$STAGING/$name"
              cp -a "built/$name/." "$STAGING/$name/"
            fi
          done
          if test -f built/linux-x86_64/GodHand_Recomp_Game; then
            mkdir -p "$STAGING/linux-x86_64"
            cp -a built/linux-x86_64/GodHand_Recomp_Game "$STAGING/linux-x86_64/"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for name in reports aot frames; do
              if test -d "$STAGING/$name"; then
                mkdir -p "built/$name"
                cp -a "$STAGING/$name/." "built/$name/"
              fi
            done
            if test -f "$STAGING/linux-x86_64/GodHand_Recomp_Game"; then
              mkdir -p built/linux-x86_64
              cp -a "$STAGING/linux-x86_64/GodHand_Recomp_Game" built/linux-x86_64/
            fi
            git lfs install --local
            git lfs track 'built/aot/*.tar.gz'
            git add .gitattributes
            for name in reports aot frames; do
              if test -d "built/$name"; then git add -f "built/$name/"; fi
            done
            if test -f built/linux-x86_64/GodHand_Recomp_Game; then
              git add -f built/linux-x86_64/GodHand_Recomp_Game
            fi
            if git diff --cached --quiet; then echo 'No changed build outputs'; exit 0; fi
            git commit -m 'build: refresh God Hand AOT diagnostics [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "New main commit arrived; retrying artifact-only update ($attempt/3)"
          done
          echo 'Could not publish diagnostics after 3 attempts' >&2
          exit 1
